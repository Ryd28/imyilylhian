<script>
/* ❤️ STAR HEART CONSTELLATION */
(function () {
  const starfield = document.getElementById("starfield");
  const STAR_COUNT = 120;
  const FORM_TIME = 5000; // 5s to form heart
  const HOLD_TIME = 15000; // 15s stay heart
  const RETURN_TIME = 5000; // 5s back
  const INTERVAL = 60000; // every 60s
  const stars = [];
  const originals = [];
  /* 🌌 Create stars */
  for (let i = 0; i < STAR_COUNT; i++) {
    const s = document.createElement("div");
    s.className = "star small";
    s.style.left = Math.random() * window.innerWidth + "px";
    const TOP_AREA = window.innerHeight * 0.3; // top 30% only
s.style.top = Math.random() * TOP_AREA + "px";
    s.style.setProperty("--twink", (1 + Math.random() * 2) + "s");
    starfield.appendChild(s);
    stars.push(s);
    originals.push({
      x: parseFloat(s.style.left),
      y: parseFloat(s.style.top),
    });
  }
  /* ❤️ Generate heart points */
  function heartPoints(count, scale = 11) {
    const pts = [];
    for (let i = 0; i < count; i++) {
      const t = (Math.PI * 2 * i) / count;
      const x =
        16 * Math.pow(Math.sin(t), 3);
      const y =
        13 * Math.cos(t) -
        5 * Math.cos(2 * t) -
        2 * Math.cos(3 * t) -
        Math.cos(4 * t);
      pts.push({ x: x * scale, y: -y * scale });
    }
    return pts;
  }
  function center() {
    return {
      x: window.innerWidth / 2,
      y: window.innerHeight / 2.5,
    };
  }
  /* 💖 Animate to heart */
  function formHeart() {
    const heart = heartPoints(stars.length);
    const c = center();
    stars.forEach((star, i) => {
      const hx = c.x + heart[i].x;
      const hy = c.y + heart[i].y;
      star.animate(
        [
          { transform: "translate(0,0)" },
          {
            transform: `translate(${hx - originals[i].x}px, ${
              hy - originals[i].y
            }px)`,
          },
        ],
        {
          duration: FORM_TIME,
          easing: "cubic-bezier(.25,.8,.25,1)",
          fill: "forwards",
        }
      );
    });
    setTimeout(returnStars, HOLD_TIME);
  }
  /* 🌙 Return to original sky */
  function returnStars() {
    stars.forEach((star, i) => {
      star.animate(
        [
          {
            transform: getComputedStyle(star).transform,
          },
          { transform: "translate(0,0)" },
        ],
        {
          duration: RETURN_TIME,
          easing: "cubic-bezier(.25,.8,.25,1)",
          fill: "forwards",
        }
      );
    });
  }
  /* ⏱ Loop */
  setInterval(formHeart, INTERVAL);
})();
</script>
